<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A glossy Shalom cat sticker pack. Turn it, draw across the seam, arrange twenty moods and save your favourites."><title>Shalom sticker pack</title><link rel="stylesheet" href="style.css?v=volume-3"></head>
<body><main><div id="stage"><div id="pack" tabindex="0" role="group" aria-label="Shalom sealed sticker pack. Drag to turn, arrow keys rotate, Home faces front. Draw across the seam to open, or focus the seam and press Enter.">
<div id="pack-back" aria-hidden="true"><div id="reverse-stickers"></div><div class="reverse-film film"><div class="seam left"></div><div class="seam right"></div><div class="seam bottom"></div></div><div class="reverse-header paper"><div class="hanger"></div><i class="charm candy-heart"></i><i class="charm candy-star"></i></div></div>
<div id="stickers" aria-label="Twenty distinct cat stickers"></div>
<div id="plastic" class="film" aria-hidden="true"><div class="seam left"></div><div class="seam right"></div><div class="seam bottom"></div><svg viewBox="0 0 740 360" preserveAspectRatio="none"><defs><linearGradient id="fold"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".44" stop-color="#fff" stop-opacity=".01"/><stop offset=".5" stop-color="#fff" stop-opacity=".64"/><stop offset=".55" stop-color="#78676d" stop-opacity=".12"/><stop offset=".65" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M0 10Q62 70 34 170T58 355L84 360Q48 248 59 172T25 0Z" fill="url(#fold)"/><path d="M712 0Q665 78 706 174T671 360L698 360Q735 251 727 174T740 0Z" fill="url(#fold)"/><path d="M8 320Q300 278 734 337L734 352Q330 310 0 343Z" fill="url(#fold)"/></svg></div>
<header id="header" class="paper"><div class="hanger"></div><img class="brand" src="assets/shalom-balloon-v1.png" alt="" aria-hidden="true"><h1 class="sr-only">Shalom</h1><span class="sr-only">Twenty distinct cat stickers</span><i class="charm candy-heart" aria-hidden="true"></i><i class="charm candy-flower" aria-hidden="true"></i><i class="charm candy-bow" aria-hidden="true"></i><i class="charm candy-star" aria-hidden="true"></i></header>
<div id="tear-track"><button id="tear" aria-label="Draw a long line across the seam to open, or press Enter"><svg viewBox="0 0 740 44" preserveAspectRatio="none" aria-hidden="true"><path d="M14 22H726" class="seam-guide"/><circle cx="14" cy="22" r="1.4"/><circle cx="726" cy="22" r="1.4"/><path id="seam-ink" d="M14 22H14"/></svg></button><div class="torn-edge" aria-hidden="true"></div></div><div id="glints" aria-hidden="true"></div></div></div>
<p id="hint" role="status">Drag the pack to turn. Draw across the seam to open.</p><button id="again" hidden>Pack it away ↶</button><div id="sticker-menu" role="menu" aria-label="Sticker options" hidden><button id="save-sticker" role="menuitem">Download sticker</button></div><p id="save-status" class="sr-only" role="status"></p></main><script src="app.js?v=volume-3"></script><script type="module" src="material.js?v=volume-3"></script></body></html>
